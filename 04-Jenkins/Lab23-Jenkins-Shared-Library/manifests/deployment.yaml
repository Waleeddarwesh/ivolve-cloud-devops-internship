apiVersion: apps/v1
kind: Deployment

metadata:
  name: jenkins-app
  labels:
    app: jenkins-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: jenkins-app

  template:
    metadata:
      labels:
        app: jenkins-app

    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: jenkins-app

          # Jenkins replaces this value using sed
          image: waleeddarwesh/jenkins-app:9

          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15

          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service

metadata:
  name: jenkins-app-service

spec:
  selector:
    app: jenkins-app

  ports:
    - port: 80
      targetPort: 8080

  type: NodePort